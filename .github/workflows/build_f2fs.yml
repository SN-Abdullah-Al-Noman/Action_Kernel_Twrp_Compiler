name: Build parse.f2fs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            pkg-config \
            make \
            gcc \
            g++ \
            cmake \
            ninja-build \
            file

      - name: Install Android NDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O /tmp/cmdline-tools.zip

          unzip -q /tmp/cmdline-tools.zip \
            -d "$HOME/android-sdk/cmdline-tools"

          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"

          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools/"* \
            "$HOME/android-sdk/cmdline-tools/latest/"

          export ANDROID_SDK_ROOT="$HOME/android-sdk"

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --licenses >/dev/null || true

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "ndk;27.0.12077973"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Build dependencies
        run: |
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          export AR="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export RANLIB="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib"
          export STRIP="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"

          echo "CC=$CC"
          "$CC" --version

      - name: Configure f2fs-tools
        run: |
          ./autogen.sh

      - name: Build parse.f2fs
        run: |
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          export AR="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export RANLIB="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib"

          ./configure \
            --host=aarch64-linux-android \
            --disable-shared \
            --enable-static

          make -j"$(nproc)"

      - name: Find parse.f2fs
        run: |
          echo "Searching for parse.f2fs..."
          find . -type f -name "parse.f2fs" -exec file {} \;

      - name: Verify Android ELF
        run: |
          PARSE="$(find . -type f -name parse.f2fs | head -n 1)"

          if [ -z "$PARSE" ]; then
            echo "ERROR: parse.f2fs was not built"
            exit 1
          fi

          echo "Binary: $PARSE"

          file "$PARSE"

          echo
          echo "ELF interpreter:"
          readelf -l "$PARSE" | grep -i interpreter || true

          echo
          echo "Needed libraries:"
          readelf -d "$PARSE" | grep NEEDED || true

      - name: Prepare artifact
        run: |
          PARSE="$(find . -type f -name parse.f2fs | head -n 1)"

          mkdir -p artifact

          cp "$PARSE" artifact/parse.f2fs

          chmod 755 artifact/parse.f2fs

          file artifact/parse.f2fs

      - name: Upload parse.f2fs
        uses: actions/upload-artifact@v4
        with:
          name: parse-f2fs-android-arm64
          path: artifact/parse.f2fs
