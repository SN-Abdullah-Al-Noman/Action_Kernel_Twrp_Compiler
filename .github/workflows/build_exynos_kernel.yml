name: Build Exynos Kernel

on:
  workflow_dispatch:
    inputs:
      GITHUB_URL:
        description: 'BRANCH_GIT_URL to clone kernel source'
        required: true
        default: '-b A176BXXS2AYI4 https://github.com/SN-Abdullah-Al-Noman/SM-A176B'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1️⃣ Checkout code
        uses: actions/checkout@v2

      - name: 2️⃣ Installing packages
        run: |
          sudo apt update -y && sudo apt install -y libyaml-dev qtbase5-dev qtbase5-dev-tools pkg-config libc6-dev-i386 apt-utils nano bison ca-certificates curl flex gcc git libc6-dev libssl-dev openssl ssh wget zip zstd sudo make clang gcc-arm-linux-gnueabi software-properties-common build-essential libarchive-tools gcc-aarch64-linux-gnu libffi-dev libncurses5-dev zlib1g zlib1g-dev libreadline-dev libbz2-dev libsqlite3-dev pigz python3 cpio lld p7zip-full xz-utils tar libelf-dev libudev-dev libpci-dev libiberty-dev pkg-config llvm clang-tools fakeroot ccache libcap-dev libunwind-dev gawk bc u-boot-tools device-tree-compiler liblzma-dev python3-pip -y
          
      - name: 3️⃣ Cloning kernel source
        run: |
          sudo git clone ${{ github.event.inputs.GITHUB_URL }} kernel_source

      - name: 5️⃣ Cloning samsung toolchain
        run: |
          cd kernel_source
          sudo wget --no-check-certificate \
              "https://github.com/SN-Abdullah-Al-Noman/samsung-toolchain/releases/download/linux-x86/clang-r450784d_linux-x86.tar.gz"
          sudo tar -xzf "$(pwd)/clang-r450784d_linux-x86.tar.gz"
          sudo rm -rf clang-r450784d_linux-x86.tar.gz

      - name: 6️⃣ Compiling kernel
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          cd kernel_source
          sudo touch logs.txt && sudo chmod a+w logs.txt
          sudo bash build_kernel.sh |& tee logs.txt
          sudo curl \
              -F "chat_id=2081111916" \
              -F document=@logs.txt \
              -F "caption=${{ github.event.inputs.GITHUB_URL }}" \
              "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument"

      - name: 7️⃣ Uploading kernel in telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          cd kernel_source/arch/arm64/boot
          sudo curl \
              -F "chat_id=2081111916" \
              -F "document=@Image" \
              -F "caption=${{ github.event.inputs.GITHUB_URL }}" \
              "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendDocument"
