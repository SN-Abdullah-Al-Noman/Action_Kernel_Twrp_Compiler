name: Build Exynos Kernel

on:
  workflow_dispatch:
    inputs:
      GITHUB_URL:
        description: 'BRANCH_GIT_URL to clone kernel source'
        required: true
        default: '-b A176BXXS2AYI4 https://github.com/SN-Abdullah-Al-Noman/SM-A176B'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1️⃣ Checkout code
        uses: actions/checkout@v2

      - name: 2️⃣ Installing packages
        run: |
          sudo apt update -y && sudo apt install -y libc6-dev-i386 apt-utils nano bison ca-certificates curl flex gcc git libc6-dev libssl-dev openssl ssh wget zip zstd sudo make clang gcc-arm-linux-gnueabi software-properties-common build-essential libarchive-tools gcc-aarch64-linux-gnu libffi-dev libncurses5-dev zlib1g zlib1g-dev libreadline-dev libbz2-dev libsqlite3-dev pigz python3 cpio lld p7zip-full xz-utils tar libelf-dev libudev-dev libpci-dev libiberty-dev pkg-config llvm clang-tools fakeroot ccache libcap-dev libunwind-dev gawk bc u-boot-tools device-tree-compiler liblzma-dev python3-pip -y
          
      - name: 3️⃣ Cloning kernel source
        run: |
          sudo git clone ${{ github.event.inputs.GITHUB_URL }} kernel_source

      - name: 4️⃣ Cloning build-tools
        run: |
          cd kernel_source
          sudo mkdir -p "$(pwd)/toolchain/prebuilts"
          sudo mkdir -p "$(pwd)/toolchain/build/kernel"

          sudo git clone --depth=1 -b android-15.0.0_r0.99 https://android.googlesource.com/kernel/prebuilts/build-tools "$(pwd)/toolchain/prebuilts/kernel-build-tools"
          sudo git clone --depth 1 -b android-15.0.0_r0.99 https://android.googlesource.com/kernel/build "$(pwd)/toolchain/build/kernel/build-tools"

      - name: 5️⃣ Cloning clang-r450784d
        run: |
          cd kernel_source
          sudo mkdir -p "$(pwd)/toolchain/clang/host/linux-x86/clang-r450784d"
          sudo wget -O "$(pwd)/toolchain/clang/host/linux-x86/clang-r450784d.tar.gz" "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-release/clang-r450784d.tar.gz"
          sudo tar -xzf "$(pwd)/toolchain/clang/host/linux-x86/clang-r450784d.tar.gz"  -C "$(pwd)/toolchain/clang/host/linux-x86/clang-r450784d"

      - name: 6️⃣ Compiling kernel
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          cd kernel_source
          sudo touch logs.txt && sudo chmod a+w logs.txt
          sudo bash build_kernel.sh |& tee logs.txt
          sudo curl \
              -F "chat_id=2081111916" \
              -F document=@logs.txt \
              -F "caption=${{ github.event.inputs.GITHUB_URL }}" \
              "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument"

      - name: 7️⃣ Uploading kernel in telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          cd kernel_source/arch/arm64/boot
          sudo curl \
              -F "chat_id=2081111916" \
              -F "document=@Image" \
              -F "caption=${{ github.event.inputs.GITHUB_URL }}" \
              "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendDocument"
